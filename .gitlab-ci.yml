# .gitlab-ci.yml – multi-container mono-repo
#
# Structure:
#   Containers/<name>/Dockerfile
#
# Each container is pushed to:
#   $CI_REGISTRY_IMAGE/<name>:latest
#   $CI_REGISTRY_IMAGE/<name>:<commit-sha>

image: docker:20.10

services:
  - name: docker:dind
    alias: docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - build

.build_template:
  stage: build
  tags:
    - dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >
      docker build
      -t "$CI_REGISTRY_IMAGE/$CONTAINER_NAME:$CI_COMMIT_SHA"
      -t "$CI_REGISTRY_IMAGE/$CONTAINER_NAME:latest"
      "Containers/$CONTAINER_NAME"
    - docker push "$CI_REGISTRY_IMAGE/$CONTAINER_NAME:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/$CONTAINER_NAME:latest"

build_minimap2:
  extends: .build_template
  variables:
    CONTAINER_NAME: minimap2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      changes:
        paths:
          - Containers/minimap2/**/*
          - Containers/minimap2/*
        compare_to: "$CI_COMMIT_BEFORE_SHA"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Containers/minimap2/**/*
        - Containers/minimap2/*
      when: always
    - when: never

build_mysql:
  extends: .build_template
  variables:
    CONTAINER_NAME: mysql
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      changes:
        paths:
          - Containers/mysql/**/*
          - Containers/mysql/*
        compare_to: "$CI_COMMIT_BEFORE_SHA"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Containers/mysql/**/*
        - Containers/mysql/*
      when: always
    - when: never

build_lora_python:
  extends: .build_template
  variables:
    CONTAINER_NAME: lora_python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      changes:
        paths:
          - Containers/lora_python/**/*
          - Containers/lora_python/*
        compare_to: "$CI_COMMIT_BEFORE_SHA"
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Containers/lora_python/**/*
        - Containers/lora_python/*
      when: always
    - when: never

